<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Apple Dropdown Fixed</title>

<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    margin: 0;
    background: #f5f5f7;
  }

  /* Navbar */
  .navbar {
    background: #1d1d1f;
    padding: 14px 40px;
    display: flex;
    gap: 30px;
    color: #fff;
  }

  .nav-item {
    position: relative;
  }

  .nav-item span {
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    height: 24px;
  }

  .nav-item span::after {
    content: "▾";
    margin-left: 6px;
    font-size: 12px;
  }

  /* Dropdown */
  .dropdown {
    position: absolute;
    top: 32px;
    left: 0;
    width: 240px;
    background: #123a5a;
    padding: 12px 0;
    border-radius: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,.25);

    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }

  /* 🔑 Mantener abierto */
  .nav-item:hover .dropdown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Bridge invisible */
  .dropdown::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 10px;
  }

  .dropdown a {
    display: block;
    padding: 10px 22px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }

  .dropdown a:hover {
    background: rgba(255,255,255,.12);
  }

  .separator {
    height: 1px;
    background: rgba(255,255,255,.25);
    margin: 8px 0;
  }
</style>
</head>

<body>

<header class="navbar">
  <div class="nav-item">
    <span>Watch</span>

    <div class="dropdown">
      <a href="#">Apple Watch</a>
      <a href="#">Apple Watch Ultra</a>
      <a href="#">Apple Watch Ultra 2</a>
      <a href="#">Apple Watch Series 10</a>

      <div class="separator"></div>

      <a href="#">Apple Health</a>
      <a href="#">Apple Watch SE</a>

      <div class="separator"></div>

      <a href="#">watchOS 11</a>
    </div>
  </div>

  <div class="nav-item"><span>iPad</span></div>
  <div class="nav-item"><span>Music</span></div>
</header>

</body>
</html>
